name: Bug Report
description: Report a bug or unexpected behavior in Slopwatch
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the information below to help us diagnose and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: input
    id: slopwatch-version
    attributes:
      label: Slopwatch Version
      description: Run `slopwatch --version` to get this
      placeholder: "e.g., 0.3.2"
    validations:
      required: true

  - type: input
    id: dotnet-version
    attributes:
      label: .NET SDK Version
      description: Run `dotnet --version` to get this
      placeholder: "e.g., 9.0.100"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: Include the version number
      placeholder: "e.g., Windows 11 25H2, Ubuntu 24.04, macOS 15.2"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Execution Environment
      description: How are you running Slopwatch?
      options:
        - Local CLI
        - Claude Code hook
        - CI/CD - GitHub Actions
        - CI/CD - Other
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command Used
      description: The exact command you ran
      placeholder: "slopwatch analyze -d ."
      render: bash
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: Describe what should have happened...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include any error messages or unexpected output.
      placeholder: Describe what actually happened...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Steps to reproduce the behavior
      placeholder: |
        1. Create a project with...
        2. Run `slopwatch ...`
        3. See error
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Slopwatch Configuration
      description: If relevant, paste your baseline.json or config snippets
      render: json
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here
    validations:
      required: false
