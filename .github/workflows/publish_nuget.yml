name: Publish NuGet

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  publish-nuget:

    name: publish-nuget
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
    - name: "Checkout"
      uses: actions/checkout@v6.0.2
      with:
        lfs: true
        fetch-depth: 0
        
    - name: "Install .NET SDK"
      uses: actions/setup-dotnet@v5.3.0
      with:
        global-json-file: "./global.json"

    - name: "Restore .NET tools"
      run: dotnet tool restore

    - name: "Update release notes"
      shell: pwsh
      run: |
        ./build.ps1

    - name: "Build and run tests"
      run: dotnet test -c Release

    - name: Create Packages
      run:  dotnet pack /p:PackageVersion=${{ github.ref_name }} -c Release -o ./output

    - name: Push Packages to NuGet
      run: dotnet nuget push "output/*.nupkg" --skip-duplicate -k ${{ secrets.NUGET_KEY }} -s https://api.nuget.org/v3/index.json

    - name: "Extract latest release notes"
      shell: pwsh
      run: |
        $content = Get-Content RELEASE_NOTES.md -Raw
        if ($content -match '(?s)(####.+?)(?=\n####|\z)') {
          $Matches[1].Trim() | Set-Content RELEASE_NOTES_LATEST.md
        } else {
          $content | Set-Content RELEASE_NOTES_LATEST.md
        }

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        name: 'Slopwatch ${{ github.ref_name }}'
        body_path: RELEASE_NOTES_LATEST.md
        files: 'output/*.nupkg'
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ github.token }}