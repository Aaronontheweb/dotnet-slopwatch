name: pr_validation

on:
  push:
    branches:
      - master
      - dev
      - main
  pull_request:
    branches:
      - master
      - dev
      - main

jobs:
  test:
    name: Test-${{matrix.os}}
    runs-on: ${{matrix.os}}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: "Checkout"
        uses: actions/checkout@v6.0.2
        with:
          lfs: true
          fetch-depth: 0

      - name: "Install .NET SDK"
        uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: "./global.json"

      - name: "Restore .NET tools"
        run: dotnet tool restore

      - name: "Update release notes"
        shell: pwsh
        run: |
          ./build.ps1

      - name: "dotnet build"
        run: dotnet build -c Release

      # Run tests with coverage
      - name: "dotnet test"
        shell: bash
        run: dotnet test -c Release --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: "Upload coverage reports"
        uses: codecov/codecov-action@v6
        with:
          directory: ./coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: "dotnet pack"
        run: dotnet pack -c Release -o ./bin/nuget

      # Dogfooding - run slopwatch on itself
      - name: "Install slopwatch tool (dogfooding)"
        if: matrix.os == 'ubuntu-latest'
        run: dotnet tool install --global --add-source ./bin/nuget Slopwatch.Cmd

      - name: "Run slopwatch on itself"
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Check current directory for slop patterns (dogfooding)
          slopwatch analyze -d . --fail-on error --stats